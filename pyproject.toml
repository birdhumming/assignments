[project]
name = "dl-alchemy"
version = "0.1.0"
description = "CS312 Deep Learning Alchemy pretraining playground."
readme = "README.md"
requires-python = ">=3.10,<3.13"
dependencies = [
    "huggingface-hub",
    "matplotlib",
    "modal>=1.5.3",
    "numpy",
    "requests",
    "sentencepiece",
    "setuptools",  # Triton 3.2 imports this when torch.compile starts.
    "torch==2.6.0",
    "tqdm",
    "wandb==0.31.0",
]

[tool.uv]
package = false
